<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學扶考古題查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：方格紙抬頭 + 搜尋列 + 結果清單，底部固定「已選題目」列 */
:root{
  --paper:#F2F4F7; --sheet:#FFFFFF; --sheet-2:#F7F9FC; --ink:#16202B; --muted:#5C6878; --line:#DCE2EA; --line-2:#EBEEF3;
  --accent:#2A4FA8; --accent-ink:#FFFFFF; --accent-soft:#E8EEFB; --accent-2:#1D3B85;
  --pen:#CF4128; --pen-soft:#FCEBE6; --mark:#FBEA93;
  --ok:#2C7A54; --ok-soft:#E1F1E8; --warn:#8A600C; --warn-soft:#FAF0D6;
  --grid:rgba(42,79,168,.075); --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -14px rgba(16,24,40,.12);
  --surface:var(--sheet); --red:var(--pen); --red-soft:var(--pen-soft);
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px; --r-sm:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E131A; --sheet:#151C26; --sheet-2:#1A2330; --ink:#E6ECF3; --muted:#93A1B2; --line:#2A3546; --line-2:#212B38;
  --accent:#8EAEFF; --accent-ink:#0C1426; --accent-soft:#1D2A48; --accent-2:#B5CBFF;
  --pen:#FF8B71; --pen-soft:#3A221E; --mark:#5E5114;
  --ok:#7DCB9F; --ok-soft:#173025; --warn:#E6B759; --warn-soft:#33280E;
  --grid:rgba(142,174,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:24px 20px;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:14px}
main .wrap{padding-block:22px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-size:21px;margin:0}
h3{font-size:16px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;border:none;background:none;padding:7px 13px;cursor:pointer;color:var(--ink);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.search{font-size:17px!important}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent;white-space:nowrap}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.dom{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.kx{background:var(--accent);color:var(--accent-ink)}
button.chip:disabled{opacity:.4;cursor:default}
.semrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.semrow>b{font-size:12.5px;color:var(--muted);width:2.6em}
.chip.ai{background:var(--red-soft);color:var(--red)}
.chip.pre{background:var(--warn-soft);color:var(--warn)}
.chip b{font-variant-numeric:tabular-nums;margin-left:3px;opacity:.75}
.msg{padding:10px 14px;border-radius:8px;font-size:14px}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.info{background:var(--accent-soft)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.result-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.result-head .lead{color:var(--muted);font-size:14px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.qcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qcard input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);cursor:pointer}
.qcard>div{min-width:0;display:flex;flex-direction:column;gap:8px}
.origin{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:14px}
.origin span{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.origin em{font-style:normal;color:var(--muted);font-size:13px}
.stem{font-family:var(--f-display);font-size:18px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 14px;font-family:var(--f-display);font-size:16.5px}
.qfig{margin:2px 0 0;align-self:flex-start;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.qfig img{display:block;max-width:100%;max-height:340px;border-radius:4px}
.fig{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;width:max-content}
.ans{font-family:var(--f-display);color:var(--red);font-size:16px;margin-top:4px}
mark{background:var(--warn-soft);color:inherit;padding:0 1px;border-radius:2px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tray .wrap{padding-block:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray b{font-variant-numeric:tabular-nums}
.tray .sp{flex:1}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal>div{background:var(--surface);border-radius:var(--r);max-width:640px;width:100%;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
footer{color:var(--muted);font-size:12.5px;text-align:center}
/* PDF 排版區（畫面外） */
.pdf-stage{position:fixed;left:-12000px;top:0;width:720px;background:#fff;color:#111;font-family:var(--f-body)}
.pdf-stage .blk{background:#fff;padding:6px 4px 14px;color:#111}
.pdf-stage .ph{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid #111;padding-bottom:12px}
.pdf-stage .ph h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.06em;color:#111}
.pdf-stage .ph .sub{font-size:14px;color:#444}
.pdf-stage .ph .who{display:flex;gap:28px;font-size:15px}
.pdf-stage .ph .who span{flex:1;border-bottom:1px solid #111;padding-bottom:2px}
.pdf-stage .qn{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-family:var(--f-display);font-size:19px;line-height:1.75}
.pdf-stage .qn .no{white-space:nowrap}
.pdf-stage .qn .tag{grid-column:2;font-family:var(--f-body);font-size:11.5px;color:#666;letter-spacing:.04em}
.pdf-stage .qn .st{white-space:pre-wrap}
.pdf-stage .qn ol{grid-column:2;list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:18px}
.pdf-stage .qn .fgi{grid-column:2;margin:4px 0}
.pdf-stage .qn .fgi img{max-width:70%;max-height:300px;display:block}
.pdf-stage .qn .fg{grid-column:2;font-family:var(--f-body);font-size:13px;color:#444;border:1px dashed #999;padding:6px 10px;border-radius:4px}
.pdf-stage .qn .sp{grid-column:2;font-family:var(--f-body);font-size:15px;margin-top:6px}
.pdf-stage .sec{font-family:var(--f-display);font-size:20px;border-left:5px solid #111;padding-left:10px;margin-top:4px}
.pdf-stage .ak{display:grid;grid-template-columns:3.2em 1fr;gap:2px 10px;font-size:14.5px;line-height:1.6}
@media (max-width:640px){h1{font-size:25px}.tray .sp{display:none}}

/* ===== 質感版樣式（與 claude.ai 版一致） ===== */
body{-webkit-font-smoothing:antialiased;line-height:1.7}
header.top{background:var(--sheet);border-bottom:1px solid var(--line)}
header.top .wrap{flex-direction:row!important;align-items:center;gap:14px!important;padding-block:18px!important}
.seal{width:42px;height:42px;flex:none;display:grid;place-items:center;border:2px solid var(--pen);color:var(--pen);border-radius:10px;font-family:var(--f-head);font-weight:900;font-size:22px;transform:rotate(-6deg)}
h1{font-family:var(--f-head)!important;font-weight:900!important;font-size:25px!important;letter-spacing:.06em}
h2{font-family:var(--f-head)!important;letter-spacing:.02em}
.panel{border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.seg{gap:2px;padding:3px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--line-2)}
.seg button{border:none!important;border-radius:9px;color:var(--muted);padding:6px 13px}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--line)}
input[type=text],select,textarea{background:var(--sheet);border-radius:10px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border-radius:10px;transition:background .15s;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.btn:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:var(--sheet);border-color:var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.chip{background:var(--sheet-2);border-color:var(--line-2)}
button.chip:hover:not(:disabled){border-color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.kx{background:var(--accent-soft);color:var(--accent);font-weight:700;border-color:transparent}
.chip.ai{background:var(--pen-soft);color:var(--pen);border-color:transparent}
.qcard{position:relative;border-radius:var(--r);padding:16px 20px;gap:4px 26px;transition:box-shadow .15s,border-color .15s}
.qcard::before{content:"";position:absolute;left:53px;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--pen) 45%,transparent)}
.qcard:hover{box-shadow:var(--shadow)}
.qcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.stem{font-size:19px!important}
.ans{color:var(--pen)!important}
mark{background:color-mix(in srgb,var(--mark) 70%,transparent)}
.tray{background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.empty{background:var(--sheet-2);border-style:dashed}
.modal>div{border-radius:20px;border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="seal" aria-hidden="true">扶</span>
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
  <h1>學扶考古題查詢</h1>
  <p>國小學習扶助・數學｜選康軒單元或輸入概念，找出相關考古題，勾選後下載 PDF 或 Word 學習單</p>
  </div>
</div></header>

<main><div class="wrap">
  <div id="load-msg"></div>

  <section class="panel" aria-label="搜尋條件">
    <div class="row" style="gap:20px;align-items:flex-end">
      <div class="field"><span class="label">年級</span><div class="seg" id="f-grade"></div></div>
      <label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="f-prev"> 一併列出前一年級（先備概念）</label>
      <div class="field"><span class="label">領域</span><select id="f-domain"><option value="">全部領域</option><option>數與量</option><option>空間與形狀</option><option>關係</option><option>資料與不確定性</option></select></div>
      <div class="field"><span class="label">學年度</span><select id="f-year"><option value="">全部</option></select></div>
    </div>
    <div class="field"><span class="label">單元或概念</span>
      <input type="text" class="search" id="f-q" placeholder="例如：分數、周長、有餘數的除法、時間" autocomplete="off">
      <div id="f-expand" style="font-size:12.5px;color:var(--muted)"></div>
    </div>
    <div class="field"><span class="label" id="unit-label">康軒單元</span><div id="f-units" style="display:flex;flex-direction:column;gap:8px"></div></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" aria-label="搜尋結果">
    <div class="result-head"><div><h2 id="r-title">考古題</h2><span class="lead" id="r-count"></span></div>
      <div class="row"><button class="btn ghost sm" id="r-all">勾選這些題目</button></div></div>
    <div class="qlist" id="r-list"></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="r-more" hidden>顯示更多</button></div>
  </section>

  <footer>題庫資料：questions.json<span id="data-date"></span></footer>
</div></main>

<div class="tray" id="tray" hidden><div class="wrap">
  <span>已選 <b id="t-n">0</b> 題</span>
  <button class="btn ghost sm" id="t-clear">清除</button>
  <span class="sp"></span>
  <button class="btn ghost sm" id="t-copy">複製題目</button>
  <button class="btn" id="t-pdf">下載學習單（PDF／Word）</button>
</div></div>
<div id="modal-root"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GN = ['','一','二','三','四','五','六'];
/* ===== 康軒國小數學單元對照（114 學年度版本） ===== */
const KX = {
 1: [
  ['上',1,'10以內的數',['10以內的數','點數']],
  ['上',2,'比長短',['比長短','長度的比較','長度的直接比較','直接比較','間接比較','高矮','最高','最短','最長','一樣長','起點','對齊','遞移','比較與遞移']],
  ['上',3,'排順序、比多少',['序數','第幾','順序','排隊','比多少','比較多少','多多少','少多少','前面','位置','基數']],
  ['上',4,'分與合',['分與合','合成','分解']],
  ['上',5,'方盒、圓罐、球',['方盒','圓罐','球','立體','積木','堆疊','正方體']],
  ['上',6,'30以內的數',['30以內']],
  ['上',7,'10以內的加法',['10以內的加法','添加型加法']],
  ['上',8,'10以內的減法',['10以內的減法','10以內的加減','拿走型減法']],
  ['上',9,'幾點鐘',['幾點','整點','點半','時鐘','鐘面','長針','短針','上午','中午','晚上','時刻','認識時間','時間']],

  ['下',2,'18以內的加法',['18以內的加法','20以內的加法','20以內的進位加法','進位加法','湊十','交換律','加法']],
  ['下',3,'圖形與分類',['圖形','拼排','圖形板','七巧板','分類','三角形','正方形','長方形','圓形']],

  ['下',9,'幾月幾日星期幾',['日曆','星期','幾月','月曆']],
 ],
 2: [
  ['上',1,'200以內的數',['200以內','300以內']],
  ['上',2,'二位數的直式加減',['二位數的直式','二位數的加法','二位數的減法','二位數退位','二位數進位','連加','直式減法','直式加法']],
  ['上',3,'量長度',['量長度','公分','直尺','刻度','個別單位','普遍單位','用尺']],
  ['上',4,'加減關係與應用',['加減關係','加減互逆','加減應用','加法和減法','加法與減法','部分與整體','比多少','比較型','多幾','比少','等號','大小比較','<、=、>','＜、＝、＞']],
  ['上',5,'面積的大小比較',['面積']],
  ['上',6,'兩步驟的加減',['加減兩步驟','兩步驟問題（加減）','連減','連續減法','兩步驟加減','先減後加','先加後減']],
  ['上',7,'2、5、4、8 的乘法',['2的乘法','5的乘法','4的乘法','8的乘法']],
  ['上',8,'幾時幾分',['幾時幾分','幾點幾分','時刻','時鐘','鐘面','數字鐘','電子鐘','時間','小時']],
  ['上',9,'3、6、9、7 的乘法',['3的乘法','6的乘法','9的乘法','7的乘法']],

/* 每冊每單元的完整標籤，例如「3上 第7單元 除法」 */
const CN_NUM = ['','一','二','三','四','五','六','七','八','九','十'];
function kxList(grade){ return (KX[grade]||[]).map(([s,n,name,kw])=>({grade, sem:s, no:n, name, kw, code:`${grade}${s}${n}`, label:`${grade}${s} 第${CN_NUM[n]}單元 ${name}`})); }
function kxByCode(code){ const m=String(code||'').match(/^([1-6])([上下])(\d+)$/); if(!m) return null; return kxList(+m[1]).find(u=>u.sem===m[2]&&u.no===+m[3])||null; }
/* 自動歸類：依題目的單元(×3)、基本概念(×2)、題幹與附圖(×1)比對各單元關鍵字，取最高分 */
function kxClassify(q){
  const g=+q.grade; const units=kxList(g); if(!units.length) return null;
  const U=String(q.unit||''), C=(q.concepts||[]).join('、'), T=String(q.stem||'')+' '+String(q.figureDesc||'');
  let best=null, bestS=0;
  for(const u of units){
    let s=0;
    for(const k of u.kw){ if(U.includes(k)) s+=3; if(C.includes(k)) s+=2; if(T.includes(k)) s+=1; }
    if(s>bestS){ bestS=s; best=u; }
  }
  const all = U+'、'+C;
  const pick = code => kxByCode(code) || best;
  /* 同名或相近單元的細分規則 */
  if(g===2 && best && /乘/.test(all) && !/兩步驟/.test(all)){
    if(/1\d|\d{2,}\s*[×xX]|[×xX]\s*\d{2,}|10的乘法|交換律|大小比較|<|＜/.test(T+all)) best=pick('2下5');
    else { const d=(all.match(/([2-9])的乘法/)||[])[1]; if(d) best=pick('2458'.includes(d)?'2上7':'2上9'); else best=pick('2下5'); }
  }
  if(g===2 && /200以內|300以內/.test(U)) best=pick('2上1');
  if(g===3 && best && best.code==='3上7' && (/三位數除以|商中間有0|整百數除法/.test(all) || /\d{3,}\s*÷/.test(T))) best=pick('3下2');
  if(g===3 && best && best.code==='3上9' && /加法|減法|加減/.test(all)) best=pick('3下1');
  if(g===6 && best && best.code==='6上8' && /時間＝距離|需要多少小時|相同的速率/.test(all+T)) best=pick('6下2');
  return best;
}
function kxOf(q){ return kxByCode(q.kxUnit) || kxClassify(q); }

function expandTerms(q){
  const base = q.split(/[\s、,，;；]+/).map(s=>s.trim()).filter(Boolean);
  const out = new Set(base);
  base.forEach(t => { Object.entries(SYN).forEach(([k,v]) => { if(t.includes(k) || k.includes(t) && t.length>=2) v.forEach(x=>out.add(x)); }); });
  /* 長一點的詞再拆成兩字一組，例如「二位數加法」也能找到「二位數的加法」 */
  const STOP = new Set(['的','以內','認識','和','與','及','數學']);
  const bi = new Set();
  base.forEach(t => { if(t.length>=3) for(let i=0;i<t.length-1;i++){ const g=t.slice(i,i+2); if(!STOP.has(g) && !/的/.test(g) && !out.has(g)) bi.add(g); } });
  return { base, all:[...out], bi:[...bi] };
}

  if(d.exportedAt) $('#data-date').textContent = `・更新於 ${new Date(d.exportedAt).toLocaleDateString('zh-TW')}・共 ${S.qs.length} 題`;
  const years=[...new Set(S.qs.map(q=>q.year).filter(Boolean))].sort((a,b)=>b-a);
  $('#f-year').innerHTML = '<option value="">全部</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)} 學年度</option>`).join('');
  render();
}

/* ---------- 篩選 ---------- */
function gradeSeg(){
  $('#f-grade').innerHTML = [0,1,2,3,4,5,6].map(g=>`<button data-v="${g}" aria-pressed="${S.grade===g}">${g?GN[g]+'年級':'全部'}</button>`).join('');
}
$('#f-grade').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.grade=+b.dataset.v; lsSet('grade',S.grade); S.unit=''; S.limit=40; gradeSeg(); render(); };
$('#f-prev').checked = S.prev;
$('#f-prev').onchange = e => { S.prev=e.target.checked; lsSet('prev',S.prev); render(); };
$('#f-domain').onchange = e => { S.domain=e.target.value; S.unit=''; render(); };
$('#f-year').onchange = e => { S.year=e.target.value; render(); };
let typing; $('#f-q').oninput = e => { clearTimeout(typing); typing=setTimeout(()=>{ S.q=e.target.value.trim(); S.unit=''; S.limit=40; render(); },180); };
$('#f-units').onclick = e => { const b=e.target.closest('[data-u]'); if(!b) return; S.unit = S.unit===b.dataset.u ? '' : b.dataset.u; S.limit=40; render(); };

function inGrade(q){ return !S.grade || q.grade===S.grade || (S.prev && q.grade===S.grade-1); }
function scoreQ(q, terms){
  if(!terms.all.length) return 1;
  let s=0; const unit=(q.unit||'')+' '+(q._kx?q._kx.name:''), con=q.concepts.join('、'), stem=q.stem||'';
  terms.all.forEach(t=>{ const w = terms.base.includes(t)?2:1;
    if(unit.includes(t)) s+=5*w; if(con.includes(t)) s+=4*w; if(stem.includes(t)) s+=1*w; if((q.figureDesc||'').includes(t)) s+=0.5*w; });
  if(terms.bi && terms.bi.length){ const hit = terms.bi.filter(g=>unit.includes(g)||con.includes(g)).length;
    if(hit >= Math.max(1, Math.ceil(terms.bi.length/2))) s += hit*0.8; }
  return s;
}
function results(){
  const terms = expandTerms(S.q);
  let list = S.qs.filter(q => (S.unit ? (q._kx&&q._kx.code===S.unit) : inGrade(q)) && (!S.domain || q.domain===S.domain) && (!S.year || q.year===S.year));
  list = list.map(q=>[q, scoreQ(q,terms)]).filter(x=>x[1]>0);
  list.sort((a,b)=> (b[1]-a[1]) || ((S.grade && a[0].grade!==b[0].grade) ? b[0].grade-a[0].grade : 0) || (+b[0].year||0)-(+a[0].year||0) || (a[0].grade-b[0].grade) || (parseInt(a[0].number)||0)-(parseInt(b[0].number)||0));
  return { list:list.map(x=>x[0]), terms };
}
function hl(text, terms){
  let h = esc(text); if(!terms.all.length) return h;
  const ts = [...terms.all].filter(t=>t.length>=1).sort((a,b)=>b.length-a.length).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!ts.length) return h;
  return h.replace(new RegExp('('+ts.join('|')+')','g'),'<mark>$1</mark>');
}
function qSource(q){ return [q.year?q.year+' 學年度':'學年度未填', q.grade?GN[q.grade]+'年級':'', q.number?'第 '+q.number+' 題':'題號未填'].join('・'); }

/* ---------- 畫面 ---------- */
function render(){
  gradeSeg();
  // 康軒單元

    const base = S.qs.filter(q=>q.grade===S.grade && (!S.domain||q.domain===S.domain) && (!S.year||q.year===S.year));

    $('#f-units').innerHTML = ['上','下'].map(sem=>`<div class="semrow"><b>${S.grade}${sem}</b>${kxList(S.grade).filter(u=>u.sem===sem).map(u=>{ const c=cnt.get(u.code)||0;
      return `<button class="chip" data-u="${u.code}" aria-pressed="${S.unit===u.code}" ${c?'':'disabled'} title="${esc(u.label)}">${CN_NUM[u.no]}・${esc(u.name)}<b>${c}</b></button>`; }).join('')}</div>`).join('');
  } else {

  if(!list.length){ el.innerHTML = `<div class="empty"><strong>找不到相關題目</strong>換個說法試試，例如「分數」「周長」「時間」，或勾選前一年級。</div>`; $('#r-more').hidden=true; renderTray(); return; }
  el.innerHTML = list.slice(0,S.limit).map(q=>{
    const pre = S.grade && q.grade===S.grade-1;
    return `<article class="qcard ${S.sel.has(q.id)?'sel':''}" data-id="${esc(q.id)}">
      <input type="checkbox" aria-label="選這題" ${S.sel.has(q.id)?'checked':''}>
      <div>
        <div class="origin"><span>${esc(qSource(q))}</span>${q.source?`<em>${esc(q.source)}</em>`:''}${pre?'<span class="chip pre">先備概念</span>':''}</div>
        <div class="stem">${hl(q.stem, terms)}</div>
        ${q.options.length?`<ol class="opts">${q.options.map((x,i)=>`<li>${OPT[i]||(i+1)+'.'} ${esc(x)}</li>`).join('')}</ol>`:''}
        ${q.figure?`<figure class="qfig"><img src="${esc(q.figure)}" alt="${esc(q.figureDesc||'題目附圖')}" loading="lazy"></figure>`:(q.hasFigure&&q.figureDesc?`<div class="fig">附圖：${esc(q.figureDesc)}</div>`:'')}
        <div class="chips">${q._kx?`<span class="chip kx">康軒 ${esc(q._kx.label)}</span>`:''}${q.domain?`<span class="chip dom">${esc(q.domain)}</span>`:''}${q.unit?`<span class="chip dom">${hl(q.unit,terms)}</span>`:''}${q.concepts.map(c=>`<span class="chip">${hl(c,terms)}</span>`).join('')}</div>
        <details><summary>看答案</summary><div class="ans">${esc(q.answer||'—')}${q.answerSource==='ai'?' <span class="chip ai" style="font-family:var(--f-body)">AI 解答，請核對</span>':''}</div></details>
      </div></article>`; }).join('');
  $('#r-more').hidden = list.length <= S.limit;
  $('#r-more').textContent = `顯示更多（還有 ${list.length-S.limit} 題）`;
  renderTray();
}
$('#r-more').onclick = () => { S.limit += 40; render(); };
$('#r-list').addEventListener('change', e => {

/* ---------- Word（.docx）：用 JSZip 直接組出 Word 檔，文字可再編輯 ---------- */
let zipLib=null;
function ensureZip(){ if(!zipLib) zipLib=loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js').catch(e=>{zipLib=null;throw e;}); return zipLib; }
const xe = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const KAI='標楷體', SANS='微軟正黑體';
function run(text,{size=28,bold=false,color='',font=KAI}={}){
  const parts=String(text).split('\n');
  return `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="${font}"/>${bold?'<w:b/>':''}${color?`<w:color w:val="${color}"/>`:''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr>`+
    parts.map((t,i)=>(i?'<w:br/>':'')+`<w:t xml:space="preserve">${xe(t)}</w:t>`).join('')+`</w:r>`;
}
function para(runs,{align='',before=0,after=80,indent=0,hanging=0,keepNext=false,pageBreak=false,border=false}={}){
  return `<w:p><w:pPr>${keepNext?'<w:keepNext/>':''}${pageBreak?'<w:pageBreakBefore/>':''}${border?'<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="111111"/></w:pBdr>':''}<w:spacing w:before="${before}" w:after="${after}" w:line="360" w:lineRule="auto"/>${indent||hanging?`<w:ind w:left="${indent}" w:hanging="${hanging}"/>`:''}${align?`<w:jc w:val="${align}"/>`:''}</w:pPr>${runs}</w:p>`;
}
function optTable(opts){
  const cell = t => `<w:tc><w:tcPr><w:tcW w:w="4400" w:type="dxa"/></w:tcPr>${para(run(t,{size:27}),{after:20,keepNext:true})}</w:tc>`;
  let rows='';
  for(let i=0;i<opts.length;i+=2){ rows += `<w:tr><w:trPr><w:cantSplit/></w:trPr>${cell(`(${i+1}) ${opts[i]}`)}${cell(opts[i+1]!=null?`(${i+2}) ${opts[i+1]}`:'')}</w:tr>`; }
  return `<w:tbl><w:tblPr><w:tblW w:w="8800" w:type="dxa"/><w:tblInd w:w="560" w:type="dxa"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4400"/><w:gridCol w:w="4400"/></w:tblGrid>${rows}</w:tbl>`;
}
async function figData(src){
  try{ const buf=await (await fetch(src)).arrayBuffer(); const blob=new Blob([buf]); const url=URL.createObjectURL(blob);
    const im=new Image(); im.src=url; await im.decode(); const w=im.naturalWidth, h=im.naturalHeight; URL.revokeObjectURL(url);
    const isPng=/^data:image\/png|\.png($|\?)/i.test(src); return {buf, w, h, ext:isPng?'png':'jpeg'}; }catch{ return null; }
}
function picXML(rid, n, w, h){
  const maxW=4320000, maxH=2700000; let cx=w*9525, cy=h*9525; const k=Math.min(1, maxW/cx, maxH/cy); cx=Math.round(cx*k); cy=Math.round(cy*k);
  return `<w:p><w:pPr><w:keepNext/><w:spacing w:before="60" w:after="60"/><w:ind w:left="560"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="附圖${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="附圖${n}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
async function makeDocx(qs,o){

    if(o.tag) body += para(run(qSource(q)+(q.source?'・'+q.source:''),{size:18,color:'777777',font:SANS}),{after:40,indent:560,keepNext:true});
    if(q._fig){ const n=media.length+1; media.push({...q._fig, rid:'rIdImg'+n, name:'image'+n+'.'+q._fig.ext}); body += picXML('rIdImg'+n, n, q._fig.w, q._fig.h); }
    else if(q.hasFigure&&q.figureDesc) body += para(run('〔附圖〕'+q.figureDesc,{size:21,color:'444444',font:SANS}),{after:40,indent:560});
    if(ch) body += optTable(q.options);
    if(!ch) body += para(run('答：＿＿＿＿＿＿＿＿＿＿＿＿',{size:26,font:SANS}),{before:o.space?600:80,indent:560});
    else if(o.space) body += para('',{after:500});
  });
  if(o.key){
    body += para(run(`答案（${o.title}）`,{size:32,bold:true}),{pageBreak:true,after:160});
    qs.forEach((q,i)=> body += para(run(`${i+1}. `,{size:24,bold:true,font:SANS})+run(q.answer||'—',{size:24,font:SANS})+(o.tag?run(`　（${qSource(q)}）`,{size:18,color:'777777',font:SANS}):''),{after:40,indent:480,hanging:480}));
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:footerReference w:type="default" r:id="rIdF"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const footer = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:sz w:val="18"/><w:color w:val="888888"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:sz w:val="18"/><w:color w:val="888888"/></w:rPr><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:rPr><w:sz w:val="18"/><w:color w:val="888888"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="${KAI}"/><w:sz w:val="28"/><w:lang w:val="en-US" w:eastAsia="zh-TW"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const zip = new window.JSZip();
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdF" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join('')}</Relationships>`);
  media.forEach(m=>zip.file('word/media/'+m.name, m.buf));
  zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/footer1.xml', footer);
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=o.title.replace(/[\\/:*?"<>|：]/g,'_')+'.docx';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
async function makePdf(qs, o, prog){
  prog('載入排版元件…'); await ensureLibs();
  const stage=document.createElement('div'); stage.className='pdf-stage'; document.body.appendChild(stage);
  const blocks=[]; const mk=(html,opt={})=>{ const d=document.createElement('div'); d.className='blk'; d.innerHTML=html; stage.appendChild(d); blocks.push({el:d,...opt}); };
  mk(`<div class="ph"><h1>${esc(o.title)}</h1><div class="sub">共 ${qs.length} 題・${new Date().toLocaleDateString('zh-TW')}</div><div class="who"><span>班級：</span><span>座號：</span><span>姓名：</span></div></div>`);
  qs.forEach((q,i)=>{ const ch=q.options.length>0;
    mk(`<div class="qn"><div class="no">${ch?'(　　) ':''}${i+1}.</div><div class="st">${esc(q.stem)}</div>
      ${o.tag?`<div class="tag">${esc(qSource(q))}${q.source?'・'+esc(q.source):''}</div>`:''}
      ${ch?`<ol>${q.options.map((x,j)=>`<li>(${j+1}) ${esc(x)}</li>`).join('')}</ol>`:''}
      ${q.figure?`<div class="fgi"><img src="${esc(q.figure)}" alt=""></div>`:(q.hasFigure&&q.figureDesc?`<div class="fg">附圖說明：${esc(q.figureDesc)}</div>`:'')}
      ${o.space?`<div class="sp" style="height:${ch?56:96}px">${ch?'':'答：＿＿＿＿＿＿＿＿＿＿'}</div>`:(ch?'':'<div class="sp">答：＿＿＿＿＿＿＿＿＿＿</div>')}</div>`); });
  if(o.key){ mk(`<div class="sec">答案（${esc(o.title)}）</div>`,{newPage:true});
    for(let i=0;i<qs.length;i+=8) mk(`<div class="ak">${qs.slice(i,i+8).map((q,j)=>`<div><b>${i+j+1}.</b></div><div>${esc(q.answer||'—')}</div>`).join('')}</div>`); }
  prog('準備字型與附圖…');
  await Promise.all([...stage.querySelectorAll('img')].map(i=>i.decode().catch(()=>i.remove())));
  try{ const t=stage.textContent; await Promise.all([document.fonts.load('19px "LXGW WenKai TC"',t),document.fonts.load('15px "Noto Sans TC"',t),document.fonts.load('bold 15px "Noto Sans TC"',t)]); await document.fonts.ready; }catch{}
  const { jsPDF } = window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=13,CW=W-2*M; let y=M;
  try{ for(let i=0;i<blocks.length;i++){ prog(`排版中 ${i+1} / ${blocks.length}`);
      const cv=await window.html2canvas(blocks[i].el,{scale:2,backgroundColor:'#ffffff',logging:false});
      const h=cv.height*CW/cv.width;
      if(blocks[i].newPage || (y+h>H-M-6 && y>M)){ pdf.addPage(); y=M; }
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',M,y,CW,h); y+=h; } }
  finally{ stage.remove(); }
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(9); pdf.setTextColor(120); pdf.text(`${i} / ${n}`,W/2,H-6,{align:'center'}); }
  pdf.save(o.title.replace(/[\\/:*?"<>|：]/g,'_')+'.pdf');
}

gradeSeg(); load();
})();
